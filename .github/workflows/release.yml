name: Build and upload distribution asset

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to update, for example v1.0.1'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package distribution files
        shell: pwsh
        run: |
          $files = @(
            'dist/QuickDiskBench.exe',
            'dist/QuickDiskBench_cli.exe',
            'dist/WebView2Loader.dll',
            'dist/index.html',
            'dist/benchmark-all-drives.ps1',
            'dist/README.txt',
            'dist/README-en.txt',
            'dist/LICENSE-en.txt',
            'dist/LICENSE-ja.txt'
          )
          foreach ($file in $files) {
            if (!(Test-Path -LiteralPath $file)) { throw "Missing distribution file: $file" }
          }
          Compress-Archive -LiteralPath $files -DestinationPath QuickDiskBench-binary.zip -Force

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: QuickDiskBench-binary.zip
          overwrite_files: true
          generate_release_notes: true
